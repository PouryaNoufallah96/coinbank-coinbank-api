version: "3"
services:
  cb.coinbank.com:
    image: coinbank.api
    container_name: cb.coinbank.com
    restart: unless-stopped
    ports:
      - "127.0.0.1:3013:80"
    networks:
      - coinbank-net
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      - ASPNETCORE_URLS=http://+
      - FirewallSettings__Rules__1__Regex=^(.*)$$
      - FirewallSettings__Rules__1__IPAddresses__0=144.76.177.153
      - FirewallSettings__Rules__1__Policy=Allow
      - FirewallSettings__Rules__0__Regex=^(.*)$$
      - FirewallSettings__Rules__0__IPAddresses__0=*
      - FirewallSettings__Rules__0__Policy=Allow

      # Database
      - MonjoSettings__ConnectionString=$mongodb_connection
      - MonjoSettings__DatabaseName=$database_name

      # JWT
      - JwtServiceSettings__Issuer=$jwtservicesettings_issuer
      - JwtServiceSettings__Audience=$jwtservicesettings_audience
      - JwtServiceSettings__SignatureKey=$jwtservicesettings_signature_key
      - JwtServiceSettings__EncryptionKey=$jwtservicesettings_encryption_key
      - JwtServiceSettings__ExpiresAfter=$jwtservicesettings_expires_after

      # JWT Client Info
      - JwtServiceSettings__ClientInfo__web_mainsets=$jwtservicesettings_clientinfo_web_value
      - JwtServiceSettings__ClientInfo__app_mainappful=$jwtservicesettings_clientinfo_app_value

      # Blockchain
      - BlockChainSettings__PrivateKey=$blockchainsettings_private_key
      - BlockChainSettings__PublicAddress=$blockchainsettings_public_address
      
      - BlockChainSettings__BEP20RpcUrl=$blockchainsettings_bep20_rpc_url
      - BlockChainSettings__BEP20WsUrl=$blockchainsettings_bep20_ws_url

      - BlockChainSettings__BEP20RpcUrl2=$blockchainsettings_bep20_rpc_url2
      - BlockChainSettings__BEP20WsUrl2=$blockchainsettings_bep20_ws_url2

      - BlockChainSettings__ERC20RpcUrl=$blockchainsettings_erc20_rpc_url
      - BlockChainSettings__ERC20WsUrl=$blockchainsettings_erc20_ws_url

      - BlockChainSettings__TRC20RpcUrl=$blockchainsettings_trc20_rpc_url
      - BlockChainSettings__TRC20WsUrl=$blockchainsettings_trc20_ws_url

      - BlockChainSettings__BEP20ChainId=$blockchainsettings_bep20_chain_id
      - BlockChainSettings__ERC20ChainId=$blockchainsettings_erc20_chain_id

      - BlockChainSettings__TransactionTimeoutSeconds=$blockchainsettings_transaction_timeout_seconds

      - BlockChainSettings__PreSaleContractAddress=$blockchainsettings_presale_contract_address
      - BlockChainSettings__StakeContractAddress=$blockchainsettings_stake_contract_address

      - BlockChainSettings__ERC20SwapContractAddress=$blockchainsettings_erc20_swap_contract_address
      - BlockChainSettings__TRC20SwapContractAddress=$blockchainsettings_trc20_swap_contract_address
      - BlockChainSettings__BEP20SwapContractAddress=$blockchainsettings_bep20_swap_contract_address

      - BlockChainSettings__DefaultGasLimit=$blockchainsettings_default_gas_limit
      - BlockChainSettings__DefaultGasPriceGwei=$blockchainsettings_default_gas_price_gwei
      - BlockChainSettings__MinGasPriceGwei=$blockchainsettings_min_gas_price_gwei
      - BlockChainSettings__MaxGasPriceGwei=$blockchainsettings_max_gas_price_gwei

      - BlockChainSettings__ReconnectInterval=$blockchainsettings_reconnect_interval
      - BlockChainSettings__MaxReconnectAttempts=$blockchainsettings_max_reconnect_attempts
      - BlockChainSettings__HeartbeatInterval=$blockchainsettings_heartbeat_interval
      - BlockChainSettings__ConnectionTimeout=$blockchainsettings_connection_timeout
      - BlockChainSettings__SubscriptionTimeout=$blockchainsettings_subscription_timeout
     
      #price 
      - PriceSetting__CMCApiKey=$pricesetting_cmcapikey
   
      # Application Pool Settings -> Applications[0]
      - ApplicationPoolSettings__Applications__0__ApplicationId=$applicationpoolsettings_applications_0_application_id
      - ApplicationPoolSettings__Applications__0__PreSharedKey=$applicationpoolsettings_applications_0_pre_shared_key
      - ApplicationPoolSettings__Applications__0__MasterSignature=$applicationpoolsettings_applications_0_master_signature

      # Application Pool Settings -> Applications[1]
      - ApplicationPoolSettings__Applications__1__ApplicationId=$applicationpoolsettings_applications_1_application_id
      - ApplicationPoolSettings__Applications__1__PreSharedKey=$applicationpoolsettings_applications_1_pre_shared_key
      - ApplicationPoolSettings__Applications__1__MasterSignature=$applicationpoolsettings_applications_1_master_signature

      # Application Pool Settings -> Applications[2]
      - ApplicationPoolSettings__Applications__2__ApplicationId=$applicationpoolsettings_applications_2_application_id
      - ApplicationPoolSettings__Applications__2__PreSharedKey=$applicationpoolsettings_applications_2_pre_shared_key
      - ApplicationPoolSettings__Applications__2__MasterSignature=$applicationpoolsettings_applications_2_master_signature
  tron.coinbank.com:
    build:
      context: ./tron-verifier
      dockerfile: ./Dockerfile
    container_name: tron-verifier
    restart: unless-stopped
    expose:
      - "3001"

   